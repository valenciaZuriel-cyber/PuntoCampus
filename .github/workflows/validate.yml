name: Validacion de Formato y Reconocimiento

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-reward:
    name: Validar Formato y Enviar Kudos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Validar formato Markdown (Linter)
        uses: DavidAnson/github-lint-action@v1.0.0
        with:
          # Valida archivos markdown ignorando lineas largas comunes en documentacion
          config: '{"MD013": false}'

      - name: Publicar felicitacion automatica si pasa las pruebas
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 **¡Excelente trabajo!** El Pull Request cumple con todos los estándares y pasó las pruebas al 100%. ✨\n\n> *"El esfuerzo continuo produce resultados visibles."* 🚀'
            })
